<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آنکات | اخبار دنیای فیلم و سریال جهان</title>
  <meta name="description" content="خبرخوان خودکار اخبار مهم و رسمی دنیای فیلم، سریال و سینما" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #14141c;
      --card-hover: #1c1c28;
      --accent: #e50914;
      --accent2: #f5c518;
      --text: #f0f0f5;
      --muted: #a0a0b0;
      --border: #2a2a38;
      --radius: 14px;
      --shadow: 0 10px 40px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,11,15,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .logo { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; color: var(--text); }
    .logo-text-wrap { display: flex; flex-direction: column; line-height: 1.15; }
    .logo-main {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff 0%, #f0f0f5 60%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-en {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 2.5px;
      margin-top: 1px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .logo-sub { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
    .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .lang-btn, .refresh-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer;
      font-family: inherit; font-size: 0.85rem; font-weight: 500; transition: all 0.2s;
    }
    .lang-btn:hover, .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .status {
      font-size: 0.78rem; color: var(--muted);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .hero { max-width: 1280px; margin: 1.25rem auto 0; padding: 0 1.25rem; }
    .slider {
      position: relative; height: 280px; border-radius: 12px;
      overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.35); background: var(--card);
    }
    .slide {
      position: absolute; inset: 0; opacity: 0; transition: opacity 0.65s ease; cursor: pointer;
    }
    .slide.active { opacity: 1; z-index: 2; }
    .slide img { width: 100%; height: 100%; object-fit: cover; }
    .slide-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.1) 100%);
    }
    .slide-content { position: absolute; bottom: 0; right: 0; left: 0; padding: 1.4rem 1.7rem; z-index: 3; }
    .slide-badge {
      display: inline-block; background: var(--accent); color: white;
      font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 5px; margin-bottom: 0.5rem;
    }
    .slide-title { font-size: clamp(1.1rem, 2.6vw, 1.55rem); font-weight: 700; line-height: 1.35; margin-bottom: 0.35rem; max-width: 720px; }
    .slide-meta { color: var(--muted); font-size: 0.82rem; }
    .slider-dots { position: absolute; bottom: 1rem; left: 1.7rem; display: flex; gap: 0.4rem; z-index: 5; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.35); cursor: pointer; transition: all 0.25s; }
    .dot.active { background: var(--accent); transform: scale(1.2); }

    main { max-width: 1280px; margin: 2.5rem auto; padding: 0 1.25rem; }
    .section-title {
      font-size: 1.45rem; font-weight: 700; margin-bottom: 1.4rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .section-title::before { content: ''; width: 5px; height: 1.35rem; background: var(--accent); border-radius: 3px; }

    .news-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;
    }
    .news-card {
      background: var(--card); border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--border); transition: transform 0.25s, background 0.25s;
      cursor: pointer; display: flex; flex-direction: column;
    }
    .news-card:hover { transform: translateY(-6px); background: var(--card-hover); }
    .news-img { width: 100%; height: 180px; object-fit: cover; background: #1a1a24; }
    .news-body { padding: 1.15rem 1.25rem 1.35rem; flex: 1; display: flex; flex-direction: column; }
    .news-source { font-size: 0.75rem; color: var(--accent2); font-weight: 600; margin-bottom: 0.35rem; }
    .news-title { font-size: 1.02rem; font-weight: 700; line-height: 1.45; margin-bottom: 0.5rem; flex: 1; }
    .news-excerpt {
      font-size: 0.88rem; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 0.85rem;
    }
    .news-meta { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; }

    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2.5rem; flex-wrap: wrap; }
    .page-btn {
      min-width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-family: inherit; font-weight: 600; cursor: pointer;
    }
    .page-btn:hover, .page-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 200;
      display: none; align-items: center; justify-content: center; padding: 1rem; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 18px; max-width: 720px; width: 100%;
      max-height: 92vh; overflow-y: auto; border: 1px solid var(--border); position: relative;
    }
    .modal-close {
      position: absolute; top: 1rem; left: 1rem; width: 38px; height: 38px; border-radius: 50%;
      background: rgba(0,0,0,0.65); border: none; color: white; font-size: 1.3rem; cursor: pointer; z-index: 5;
      display: grid; place-items: center;
    }
    .modal-img { width: 100%; height: 260px; object-fit: cover; }
    .modal-body { padding: 1.6rem 1.8rem 2rem; }
    .modal-title { font-size: 1.4rem; font-weight: 800; line-height: 1.4; margin-bottom: 0.6rem; }
    .modal-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.1rem; }
    .modal-content { font-size: 1rem; color: #d0d0dc; margin-bottom: 1.5rem; }
    .modal-content p { margin-bottom: 0.9rem; }
    .external-link {
      display: inline-block; margin-bottom: 1.5rem; color: var(--accent2); font-weight: 600; text-decoration: none;
    }
    .external-link:hover { text-decoration: underline; }

    .comments-section { border-top: 1px solid var(--border); padding-top: 1.4rem; }
    .comments-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }
    .comment-form { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.5rem; }
    .comment-form input, .comment-form textarea {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.75rem 1rem; color: var(--text); font-family: inherit; font-size: 0.95rem; resize: vertical;
    }
    .comment-form textarea { min-height: 85px; }
    .comment-form button {
      align-self: flex-start; background: var(--accent); color: white; border: none;
      padding: 0.65rem 1.4rem; border-radius: 10px; font-family: inherit; font-weight: 600; cursor: pointer;
    }
    .comment-list { display: flex; flex-direction: column; gap: 1rem; }
    .comment-item { background: var(--bg); border-radius: 12px; padding: 1rem 1.15rem; border: 1px solid var(--border); }
    .comment-author { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .comment-text { font-size: 0.92rem; color: #c8c8d4; }
    .comment-date { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }

    footer {
      margin-top: 4rem; padding: 2.5rem 1.25rem; border-top: 1px solid var(--border);
      text-align: center; color: var(--muted); font-size: 0.9rem;
    }
    footer strong { color: var(--text); }

    .loading, .error {
      text-align: center; padding: 3rem 1rem; color: var(--muted);
    }
    .error { color: #f87171; }

    @media (max-width: 700px) {
      .slider { height: 220px; }
      .slide-content { padding: 1.1rem 1.2rem; }
      .slide-title { font-size: 1.05rem; }
      .news-grid { grid-template-columns: 1fr; }
      .modal-img { height: 190px; }
      .logo-main { font-size: 1.35rem; }
      .logo-en { font-size: 0.7rem; letter-spacing: 2px; }
    }
    html[dir="ltr"] .slider-dots { left: auto; right: 2.2rem; }
    html[dir="ltr"] .modal-close { left: auto; right: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#" class="logo" onclick="location.reload()">
        <div class="logo-text-wrap">
          <div class="logo-main">آنکات</div>
          <div class="logo-en">UNCUT</div>
          <div class="logo-sub" data-i18n="tagline">اخبار دنیای فیلم و سریال جهان</div>
        </div>
      </a>
      <div class="header-actions">
        <div class="status" id="status">
          <span class="dot"></span>
          <span data-i18n="auto">آپدیت خودکار هر ۱ ساعت</span>
        </div>
        <button class="lang-btn" id="langToggle" onclick="toggleLang()">English</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="slider" id="slider">
      <div class="loading" data-i18n="loading">در حال بارگذاری اخبار...</div>
    </div>
  </section>

  <main>
    <h2 class="section-title" data-i18n="latest">آخرین اخبار مهم و رسمی</h2>
    <div class="news-grid" id="newsGrid">
      <div class="loading" data-i18n="loading">در حال بارگذاری...</div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">×</button>
      <img class="modal-img" id="modalImg" src="" alt="" />
      <div class="modal-body">
        <div class="news-source" id="modalSource"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-content" id="modalContent"></div>
        <a class="external-link" id="modalLink" href="#" target="_blank" rel="noopener" data-i18n="sourceLink">مشاهده منبع اصلی ←</a>

        <div class="comments-section">
          <h3 class="comments-title" data-i18n="comments">نظرات</h3>
          <form class="comment-form" id="commentForm" onsubmit="submitComment(event)">
            <input type="text" id="commentName" data-i18n-placeholder="namePlaceholder" placeholder="نام شما" required />
            <textarea id="commentText" data-i18n-placeholder="commentPlaceholder" placeholder="نظر خود را بنویسید..." required></textarea>
            <button type="submit" data-i18n="submitComment">ارسال نظر</button>
          </form>
          <div class="comment-list" id="commentList"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p><strong data-i18n="logo">آنکات</strong> — <span data-i18n="footer">خبرخوان خودکار اخبار مهم و رسمی دنیای فیلم و سریال</span></p>
    <p style="margin-top:0.45rem;font-size:0.8rem;" id="lastUpdate"></p>
  </footer>

  <script>
    let newsData = [];
    let currentLang = 'fa';
    let currentPage = 1;
    const perPage = 10;
    let currentNewsId = null;
    let updatedAt = null;

    const i18n = {
      logo: { fa: 'آنکات', en: 'UNCUT' },
      tagline: { fa: 'اخبار دنیای فیلم و سریال جهان', en: 'World Film & Series News' },
      latest: { fa: 'آخرین اخبار مهم و رسمی', en: 'Latest Important & Official News' },
      comments: { fa: 'نظرات', en: 'Comments' },
      namePlaceholder: { fa: 'نام شما', en: 'Your name' },
      commentPlaceholder: { fa: 'نظر خود را بنویسید...', en: 'Write your comment...' },
      submitComment: { fa: 'ارسال نظر', en: 'Post Comment' },
      footer: { fa: 'خبرخوان خودکار اخبار مهم و رسمی دنیای فیلم و سریال', en: 'Automatic reader for important & official film and series news' },
      loading: { fa: 'در حال بارگذاری اخبار...', en: 'Loading news...' },
      auto: { fa: 'آپدیت خودکار هر ۱ ساعت', en: 'Auto-update every 1 hour' },
      sourceLink: { fa: 'مشاهده منبع اصلی ←', en: 'View original source →' },
      breaking: { fa: 'خبر ویژه', en: 'Breaking' },
      readMore: { fa: 'ادامه مطلب', en: 'Read more' },
      noComments: { fa: 'هنوز نظری ثبت نشده. اولین نفر باشید!', en: 'No comments yet. Be the first!' },
      error: { fa: 'خطا در بارگذاری اخبار. چند لحظه دیگر دوباره تلاش کنید.', en: 'Failed to load news. Please try again shortly.' }
    };

    function t(key) { return i18n[key] ? i18n[key][currentLang] : key; }

    async function loadNews() {
      try {
        const res = await fetch('news.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        newsData = data.news || [];
        updatedAt = data.updated_at;
        renderAll();
        updateLastUpdate();
      } catch (err) {
        console.error(err);
        document.getElementById('slider').innerHTML = `<div class="error">${t('error')}</div>`;
        document.getElementById('newsGrid').innerHTML = `<div class="error">${t('error')}</div>`;
      }
    }

    function updateLastUpdate() {
      const el = document.getElementById('lastUpdate');
      if (!updatedAt) return;
      const d = new Date(updatedAt);
      const str = currentLang === 'fa'
        ? d.toLocaleString('fa-IR')
        : d.toLocaleString('en-US');
      el.textContent = (currentLang === 'fa' ? 'آخرین به‌روزرسانی: ' : 'Last update: ') + str;
    }

    function renderAll() {
      renderSlider();
      renderNews();
    }

    function renderSlider() {
      const important = newsData.filter(n => n.important).slice(0, 3);
      if (!important.length) {
        // اگر خبر خیلی مهم نبود، ۳ تای اول را بگیر
        important.push(...newsData.slice(0, 3));
      }
      const slider = document.getElementById('slider');
      if (!important.length) {
        slider.innerHTML = `<div class="loading">${t('loading')}</div>`;
        return;
      }
      slider.innerHTML = important.map((n, i) => `
        <div class="slide ${i === 0 ? 'active' : ''}" data-id="${n.id}" onclick="openModal('${n.id}')">
          <img src="${n.image}" alt="" loading="eager" onerror="this.src='https://picsum.photos/900/500?grayscale'" />
          <div class="slide-overlay"></div>
          <div class="slide-content">
            <span class="slide-badge">${t('breaking')}</span>
            <h2 class="slide-title">${n.title[currentLang] || n.title.en}</h2>
            <div class="slide-meta">${n.source[currentLang] || n.source.en} • ${formatDate(n.date)}</div>
          </div>
        </div>
      `).join('') + `
        <div class="slider-dots">
          ${important.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`).join('')}
        </div>
      `;

      let idx = 0;
      const slides = () => slider.querySelectorAll('.slide');
      const dots = () => slider.querySelectorAll('.dot');
      setInterval(() => {
        const s = slides(), d = dots();
        if (!s.length) return;
        s[idx]?.classList.remove('active');
        d[idx]?.classList.remove('active');
        idx = (idx + 1) % s.length;
        s[idx]?.classList.add('active');
        d[idx]?.classList.add('active');
      }, 5500);

      slider.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', e => {
          e.stopPropagation();
          const i = +dot.dataset.index;
          slides().forEach(s => s.classList.remove('active'));
          dots().forEach(d => d.classList.remove('active'));
          slides()[i]?.classList.add('active');
          dot.classList.add('active');
          idx = i;
        });
      });
    }

    function formatDate(d) {
      if (!d) return '';
      const date = new Date(d);
      return currentLang === 'fa'
        ? date.toLocaleDateString('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' })
        : date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function renderNews() {
      const start = (currentPage - 1) * perPage;
      const pageItems = newsData.slice(start, start + perPage);
      const grid = document.getElementById('newsGrid');
      if (!pageItems.length) {
        grid.innerHTML = `<div class="loading">${t('loading')}</div>`;
        return;
      }
      grid.innerHTML = pageItems.map(n => `
        <article class="news-card" onclick="openModal('${n.id}')">
          <img class="news-img" src="${n.image}" alt="" loading="lazy" onerror="this.src='https://picsum.photos/800/450?grayscale'" />
          <div class="news-body">
            <div class="news-source">${n.source[currentLang] || n.source.en}</div>
            <h3 class="news-title">${n.title[currentLang] || n.title.en}</h3>
            <p class="news-excerpt">${n.excerpt[currentLang] || n.excerpt.en}</p>
            <div class="news-meta">
              <span>${formatDate(n.date)}</span>
              <span>${t('readMore')} →</span>
            </div>
          </div>
        </article>
      `).join('');
      renderPagination();
    }

    function renderPagination() {
      const total = Math.ceil(newsData.length / perPage) || 1;
      const pag = document.getElementById('pagination');
      let html = `<button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
      for (let i = 1; i <= total; i++) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="changePage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
      pag.innerHTML = html;
    }

    function changePage(p) {
      const total = Math.ceil(newsData.length / perPage) || 1;
      if (p < 1 || p > total) return;
      currentPage = p;
      renderNews();
      window.scrollTo({ top: document.querySelector('main').offsetTop - 80, behavior: 'smooth' });
    }

    function openModal(id) {
      const n = newsData.find(x => x.id === id);
      if (!n) return;
      currentNewsId = id;
      document.getElementById('modalImg').src = n.image;
      document.getElementById('modalSource').textContent = n.source[currentLang] || n.source.en;
      document.getElementById('modalTitle').textContent = n.title[currentLang] || n.title.en;
      document.getElementById('modalMeta').textContent = `${formatDate(n.date)} • ${n.source[currentLang] || n.source.en}`;
      document.getElementById('modalContent').innerHTML = `<p>${n.content[currentLang] || n.content.en}</p>`;
      const link = document.getElementById('modalLink');
      link.href = n.link || '#';
      link.style.display = n.link ? 'inline-block' : 'none';
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
      loadComments(id);
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay') && !e.target.classList.contains('modal-close')) return;
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
      currentNewsId = null;
    }

    function loadComments(newsId) {
      const key = 'uncut_c_' + newsId;
      const comments = JSON.parse(localStorage.getItem(key) || '[]');
      const list = document.getElementById('commentList');
      if (!comments.length) {
        list.innerHTML = `<p style="color:var(--muted);font-size:0.9rem;">${t('noComments')}</p>`;
        return;
      }
      list.innerHTML = comments.map(c => `
        <div class="comment-item">
          <div class="comment-author">${escapeHtml(c.name)}</div>
          <div class="comment-text">${escapeHtml(c.text)}</div>
          <div class="comment-date">${new Date(c.date).toLocaleString(currentLang==='fa'?'fa-IR':'en-US')}</div>
        </div>
      `).join('');
    }

    function submitComment(e) {
      e.preventDefault();
      if (!currentNewsId) return;
      const name = document.getElementById('commentName').value.trim();
      const text = document.getElementById('commentText').value.trim();
      if (!name || !text) return;
      const key = 'uncut_c_' + currentNewsId;
      const comments = JSON.parse(localStorage.getItem(key) || '[]');
      comments.unshift({ name, text, date: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(comments));
      document.getElementById('commentForm').reset();
      loadComments(currentNewsId);
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toggleLang() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('langToggle').textContent = currentLang === 'fa' ? 'English' : 'فارسی';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[key]) el.textContent = i18n[key][currentLang];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (i18n[key]) el.placeholder = i18n[key][currentLang];
      });
      renderAll();
      updateLastUpdate();
      if (currentNewsId) openModal(currentNewsId);
    }

    // شروع
    loadNews();
    // هر ۱۰ دقیقه یک‌بار کش را چک کن (در صورت آپدیت جدید)
    setInterval(loadNews, 10 * 60 * 1000);
  </script>
</body>
</html>
